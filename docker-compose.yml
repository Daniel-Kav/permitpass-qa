services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: permitpass
      POSTGRES_PASSWORD: permitpass   # local dev only
      POSTGRES_DB: permitpass
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitpass"]
      interval: 2s
      retries: 20

  mocks:
    image: wiremock/wiremock:3.10.0
    command: ["--disable-banner"]
    ports: ["8089:8080"]
    volumes:
      - ./mocks:/home/wiremock:ro

  api:
    build: ./app/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://permitpass:permitpass@db:5432/permitpass
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789}
      CERT_SECRET: ${CERT_SECRET:-local-dev-cert-secret-0123456789}
      SEED_DEMO_USERS: "true"   # local dev only
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}   # perf soak runs raise this
      KRA_BASE_URL: http://mocks:8080
      MPESA_BASE_URL: http://mocks:8080
      MPESA_CALLBACK_TOKEN: ${MPESA_CALLBACK_TOKEN:-local-dev-callback-token-0123456789}
      # WireMock (in its container) calls the API back by its Compose service name
      MPESA_CALLBACK_URL: http://api:8000/payments/mpesa/callback?token=${MPESA_CALLBACK_TOKEN:-local-dev-callback-token-0123456789}
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_started
