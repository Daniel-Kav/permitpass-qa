services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: permitpass
      POSTGRES_PASSWORD: permitpass   # local dev only
      POSTGRES_DB: permitpass
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitpass"]
      interval: 2s
      retries: 20

  api:
    build: ./app/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://permitpass:permitpass@db:5432/permitpass
    depends_on:
      db:
        condition: service_healthy
