name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi
          cat notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$GITHUB_REF_NAME: $(grep -m1 "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md | sed 's/.*: //')"
          gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --verify-tag
