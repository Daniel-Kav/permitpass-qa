name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: api-tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: permitpass
          POSTGRES_PASSWORD: permitpass
          POSTGRES_DB: permitpass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permitpass"
          --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://permitpass:permitpass@localhost:5432/permitpass_test' || 'sqlite+pysqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/api/requirements.txt
            tests/api/requirements.txt
      - run: pip install -r tests/api/requirements.txt
      - run: python -m pytest -q --junitxml=reports/junit-api-${{ matrix.db }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results-${{ matrix.db }}
          path: reports/junit-api-${{ matrix.db }}.xml

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build
          ./scripts/wait-for.sh http://localhost:8000/health 90
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package.json') }}
      - name: Playwright smoke
        timeout-minutes: 10
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          # Runner already has Chromium's system libraries; --with-deps only adds fonts from a slow apt mirror
          npx playwright install chromium
          npx playwright test --project=chromium
      - uses: grafana/setup-k6-action@v1
      - name: k6 perf smoke
        uses: grafana/run-k6-action@v1
        with:
          path: perf/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Stop stack
        if: always()
        run: docker compose down -v
