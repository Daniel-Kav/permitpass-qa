name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble

jobs:
  api-tests:
    name: api-tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: permitpass
          POSTGRES_PASSWORD: permitpass
          POSTGRES_DB: permitpass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permitpass"
          --health-interval 2s --health-retries 20
    env:
      # Deliberately non-UTC DB session time zone so time-zone bugs surface in CI (#13)
      PGTZ: Africa/Nairobi
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://permitpass:permitpass@localhost:5432/permitpass_test' || 'sqlite+pysqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/api/requirements.txt
            tests/api/requirements.txt
      - run: pip install -r tests/api/requirements.txt
      - run: python -m pytest -q --junitxml=reports/junit-api-${{ matrix.db }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results-${{ matrix.db }}
          path: reports/junit-api-${{ matrix.db }}.xml

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=mobile-chrome
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (API + PostgreSQL)
        run: |
          docker compose up -d --build
          ./scripts/wait-for.sh http://localhost:8000/health 90
      - name: Playwright in the official image (all browsers preinstalled)
        timeout-minutes: 12
        run: |
          docker run --rm --network host --ipc=host -e CI=1 \
            -v "$PWD/tests/e2e:/e2e" -w /e2e "$PLAYWRIGHT_IMAGE" \
            bash -c "npm ci --no-audit --no-fund && npx playwright test ${{ matrix.projects }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tests/e2e/playwright-report
      - name: API logs on failure
        if: failure()
        run: docker compose logs api
      - name: Stop stack
        if: always()
        run: docker compose down -v

  perf-smoke:
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build
          ./scripts/wait-for.sh http://localhost:8000/health 90
      - uses: grafana/setup-k6-action@v1
      - name: k6 smoke (p95 < 300 ms, errors < 1%)
        uses: grafana/run-k6-action@v1
        with:
          path: perf/smoke.js
      - name: Stop stack
        if: always()
        run: docker compose down -v

  security-scan:
    name: security (ZAP baseline)
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build
          ./scripts/wait-for.sh http://localhost:8000/health 90
      - name: OWASP ZAP baseline (passive) scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000/
          rules_file_name: .zap/rules.tsv
          cmd_options: "-j"   # AJAX spider for the JS pages; no -I, so any warning fails the job
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report
      - name: Stop stack
        if: always()
        run: docker compose down -v
