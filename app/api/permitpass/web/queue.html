<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Officer queue · PermitPass</title>
<link rel="stylesheet" href="/styles.css">
<script src="/app.js" defer></script>
<script src="/queue.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <div class="bar">
    <a class="logo" href="/">PermitPass</a>
    <nav aria-label="Main">
      <ul>
        <li><a href="/queue.html" aria-current="page">Officer queue</a></li><li><button type="button" class="link" data-logout>Log out</button></li>
        <li><a href="/verify.html">Verify a permit</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main">
  <h1>Officer queue</h1>
  <div id="status" role="status" aria-live="polite" hidden></div>
  <form id="filter" class="card row" aria-label="Filter applications">
    <div>
      <label for="state">Status</label>
      <select id="state" name="state">
        <option value="paid">Paid, awaiting review</option>
        <option value="approved">Approved, ready to issue</option>
        <option value="issued">Issued</option>
        <option value="submitted">Submitted, unpaid</option>
        <option value="">All</option>
      </select>
    </div>
  </form>
  <div class="table-wrap">
    <table>
      <caption id="count">Loading…</caption>
      <thead><tr><th scope="col">Business</th><th scope="col">KRA PIN</th><th scope="col">Status</th><th scope="col">Created</th><th scope="col">Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<template id="reason-tpl">
  <form class="reason-form">
    <div><label>Reason</label><input name="reason" required maxlength="500"></div>
    <button type="submit" class="danger"></button>
    <button type="button" class="secondary" data-cancel>Cancel</button>
  </form>
</template>
</body>
</html>
