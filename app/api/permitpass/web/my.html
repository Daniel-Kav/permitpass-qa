<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My applications · PermitPass</title>
<link rel="stylesheet" href="/styles.css">
<script src="/app.js" defer></script>
<script src="/my.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <div class="bar">
    <a class="logo" href="/">PermitPass</a>
    <nav aria-label="Main">
      <ul>
        <li><a href="/my.html" aria-current="page">My applications</a></li><li><button type="button" class="link" data-logout>Log out</button></li>
        <li><a href="/verify.html">Verify a permit</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main">
  <h1>My applications</h1>
  <div id="status" role="status" aria-live="polite" hidden></div>
  <section class="card" aria-labelledby="new-h">
    <h2 id="new-h">New permit application</h2>
    <form id="new-app" novalidate>
      <div class="row">
        <div>
          <label for="business_name">Business name</label>
          <input id="business_name" name="business_name" required minlength="2" maxlength="120">
        </div>
        <div>
          <label for="kra_pin">KRA PIN</label>
          <input id="kra_pin" name="kra_pin" required aria-describedby="kra-hint" autocomplete="off">
          <p id="kra-hint" class="hint">A or P, 9 digits, then a letter, e.g. A123456789Z</p>
        </div>
        <div class="btn-cell"><button type="submit">Create application</button></div>
      </div>
    </form>
  </section>
  <section aria-labelledby="list-h">
    <h2 id="list-h">Your applications</h2>
    <div class="table-wrap">
      <table>
        <caption>Permit fee is KES 2,500. Draft applications must be submitted, then paid.</caption>
        <thead><tr><th scope="col">Business</th><th scope="col">KRA PIN</th><th scope="col">Status</th><th scope="col">Created</th><th scope="col">Next step</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
