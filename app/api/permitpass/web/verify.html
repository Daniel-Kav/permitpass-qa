<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a permit · PermitPass</title>
<link rel="stylesheet" href="/styles.css">
<script src="/app.js" defer></script>
<script src="/verify.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <div class="bar">
    <a class="logo" href="/">PermitPass</a>
    <nav aria-label="Main">
      <ul>
        
        <li><a href="/verify.html">Verify a permit</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main">
  <h1>Verify a permit</h1>
  <section class="card narrow" aria-labelledby="v-h">
    <h2 id="v-h">Check a certificate</h2>
    <p class="muted">Enter the certificate number and the security code printed on the permit.</p>
    <form id="verify" novalidate>
      <label for="number">Certificate number</label>
      <input id="number" name="number" required placeholder="PP-2026-XXXXXXXX" autocomplete="off">
      <label for="sig">Security code</label>
      <input id="sig" name="sig" required autocomplete="off">
      <p><button type="submit">Verify</button></p>
    </form>
    <div id="result" role="status" aria-live="polite"></div>
  </section>
</main>
</body>
</html>
