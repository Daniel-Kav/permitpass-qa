# The citizen cancels on the phone (stub phone 0700000032); the app explains and allows paying again
appId: ke.permitpass.citizen
name: Cancelled payment is explained
---
- evalScript: ${output.name = 'Cancel Duka ' + Date.now().toString(36)}
- runFlow: ../subflows/login.yaml
- runFlow:
    file: ../subflows/create_application.yaml
    env:
      PIN: "A123456789Z"
- scrollUntilVisible:
    element:
      id: "submit-${output.name}"
- tapOn:
    id: "submit-${output.name}"
- scrollUntilVisible:
    element:
      id: "pay-${output.name}"
- tapOn:
    id: "pay-${output.name}"
- tapOn:
    id: "phone-${output.name}"
- inputText: "0700000032"
- hideKeyboard
- tapOn:
    id: "send-${output.name}"
- extendedWaitUntil:
    visible: "Payment for ${output.name} did not go through."
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ".*Request cancelled by user.*"
- assertVisible:
    id: "pay-${output.name}"
