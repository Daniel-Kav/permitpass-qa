appId: ke.permitpass.citizen
name: Wrong password shows one generic message
---
- launchApp:
    clearState: true
- tapOn:
    id: "email"
- inputText: "citizen@permitpass.test"
- tapOn:
    id: "password"
- inputText: "not-the-password"
- hideKeyboard
- tapOn:
    id: "login"
- extendedWaitUntil:
    visible: "Incorrect email or password"
    timeout: 10000
